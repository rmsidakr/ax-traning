<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보안정책 개선 검토 도우미</title>
<style>
:root {
  color-scheme: light;
  --page: #eef1f6;
  --card: #ffffff;
  --ink: #121826;
  --ink2: #384152;
  --muted: #5b6474;
  --line: #d6dbe4;
  --line2: #e7eaf0;
  --soft: #f5f7fa;
  --accent: #1d5bbf;
  --accent-ink: #ffffff;
  --accent-soft: #e8f0fc;
  --accent-line: #b9cdee;
  --bar: #2a78d6;
  --bar-dim: #8a93a3;
  --grid: #e4e7ec;
  --axis: #b9c0cb;
  --good: #136c37;
  --good-soft: #e2f3e8;
  --good-dot: #1f8a4c;
  --warn: #7f4c00;
  --warn-soft: #fff0cf;
  --warn-line: #e5b04a;
  --crit: #b3261e;
  --crit-soft: #fdecea;
  --crit-line: #e9b4b0;
  --shadow: 0 1px 2px rgba(18,24,38,.06), 0 4px 14px rgba(18,24,38,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1218; --card: #1a1e26; --ink: #f2f4f8; --ink2: #c9ced8; --muted: #a3aab7;
    --line: #343a46; --line2: #2a2f39; --soft: #151922; --accent: #4c8bf0; --accent-ink: #0b1020; --accent-soft: #1e2b44; --accent-line: #34507e;
    --bar: #3987e5; --bar-dim: #6b7383; --grid: #2a2f39; --axis: #454c59;
    --good: #5fcf86; --good-soft: #17301f; --good-dot: #2f9e5c;
    --warn: #f3c56b; --warn-soft: #3a2d12; --warn-line: #a77a24; --crit: #f08a83; --crit-soft: #3b1d1b; --crit-line: #6b302c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1218; --card: #1a1e26; --ink: #f2f4f8; --ink2: #c9ced8; --muted: #a3aab7;
  --line: #343a46; --line2: #2a2f39; --soft: #151922; --accent: #4c8bf0; --accent-ink: #0b1020; --accent-soft: #1e2b44; --accent-line: #34507e;
  --bar: #3987e5; --bar-dim: #6b7383; --grid: #2a2f39; --axis: #454c59;
  --good: #5fcf86; --good-soft: #17301f; --good-dot: #2f9e5c;
  --warn: #f3c56b; --warn-soft: #3a2d12; --warn-line: #a77a24; --crit: #f08a83; --crit-soft: #3b1d1b; --crit-line: #6b302c;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif;
  font-size: 15px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere;
}
.app { height: 100vh; min-height: 640px; display: flex; flex-direction: column; gap: 8px; padding: 12px 24px 10px; }
svg.i { width: 17px; height: 17px; flex: none; vertical-align: -3px; }
button { font: inherit; cursor: pointer; }
.mono { font-family: Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace; font-weight: 700; letter-spacing: -.01em; }

/* 상단 */
.top { display: flex; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 7px 16px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo svg { width: 25px; height: 25px; }
.brand h1 { margin: 0; font-size: 25px; line-height: 1.2; letter-spacing: -.01em; }
.brand .sub { font-size: 14px; color: var(--muted); }
.pill { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 13px; }
.pill.file { background: var(--accent-soft); }
.pill .k { font-size: 14px; color: var(--muted); line-height: 1.25; }
.pill .v { font-size: 16px; font-weight: 700; line-height: 1.3; }
.pill .read { font-size: 14px; color: var(--good); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.pill .new { font-size: 14px; font-weight: 700; color: var(--crit); background: var(--crit-soft); border-radius: 999px; padding: 0 9px; }
.spacer { flex: 1; }
.last { font-size: 14px; color: var(--muted); text-align: right; line-height: 1.35; white-space: nowrap; }
.last b { color: var(--ink); font-weight: 700; font-size: 15px; }
.run { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; background: var(--accent);
  color: var(--accent-ink); font-size: 20px; font-weight: 700; padding: 9px 26px; }
.run svg { width: 18px; height: 18px; }
.run[disabled] { opacity: .55; cursor: default; }

/* 10단계 진행 */
.stepper { display: flex; gap: 10px; }
.sg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px 12px 7px; box-shadow: var(--shadow); min-width: 0; }
.sg.g-run { flex: 8.15; border-color: var(--accent-line); }
.sg.g-recv { flex: 1.22; border-color: var(--warn-line); }
.sg.g-apply { flex: 1.18; border-style: dashed; box-shadow: none; background: transparent; }
.sg-h { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; }
.sg-h b { color: var(--ink); font-size: 15px; }
.sg-h .gst { margin-left: auto; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.sg-h .gst.done { color: var(--good); }
.sg-h .gst.busy { color: var(--accent); }
.sg-steps { display: grid; gap: 0; }
.sg.g-run .sg-steps { grid-template-columns: repeat(8, 1fr); }
.st { display: flex; align-items: center; gap: 7px; min-width: 0; }
.st .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 14px; font-weight: 700;
  background: var(--line2); color: var(--muted); border: 2px solid transparent; }
.st.done .dot { background: var(--good-dot); color: #fff; }
.st.ready .dot { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.st.next .dot { background: transparent; color: var(--muted); border: 2px dashed var(--axis); }
.st.busy .dot { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.st .tx { flex: none; line-height: 1.25; }
.st .lb { font-size: 15px; font-weight: 700; white-space: nowrap; }
.st.wait .lb { color: var(--muted); }
.st .us { display: flex; gap: 3px; margin-top: 2px; align-items: center; font-size: 14px; color: var(--muted); white-space: nowrap; }
.u { width: 19px; height: 19px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 14px; font-weight: 700; line-height: 1; }
.u.q { background: var(--accent); color: var(--accent-ink); }
.u.a { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.u.r { background: var(--warn); color: var(--card); }
.u.n { background: transparent; color: var(--muted); border: 1.5px dashed var(--axis); }
.st .ln { flex: 1; height: 2px; background: var(--line); margin: -18px 6px 0 2px; min-width: 0; align-self: center; }
.st.done .ln { background: #9fd3b2; }
.st .us .tag { font-weight: 700; }
.st.ready .us .tag { color: var(--warn); }

/* 데이터 AI Ready 상태 띠: 교안에서 0.82배로 줄어도 글자가 14px 넘게 보이게 크게.
   #ready로 씀(.ready로 쓰면 단계 표시의 .st.ready·.status.ready에도 걸림) */
#ready { flex: none; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 12px; padding: 6px 14px 8px; box-shadow: var(--shadow); }
.rd-h { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; line-height: 1.3; padding: 0 2px; }
.rd-h .ttl { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; color: var(--accent); align-self: center; }
.rd-h .ttl svg { width: 24px; height: 24px; }
.rd-h .msg { font-size: 18px; color: var(--ink2); }
.rd-h .msg b { color: var(--ink); }
.rd-cells { display: grid; grid-template-columns: 1fr 0.86fr 1.08fr 1fr 1.06fr; gap: 8px; margin-top: 5px; }
.rd-c { display: grid; grid-template-columns: 32px 1fr; column-gap: 10px; align-items: center; padding: 5px 12px 6px; min-width: 0;
  background: var(--card); border: 1px solid var(--accent-line); border-radius: 10px; }
.rd-c.part { border-color: var(--warn-line); }
.rd-c.no { border-color: var(--crit-line); }
.rd-c .sym { grid-row: 1 / 3; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.rd-c .sym svg { width: 20px; height: 20px; }
.rd-c.ok .sym { background: var(--good-dot); color: #fff; }
.rd-c.part .sym { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 2px var(--warn-line); }
.rd-c.no .sym { background: var(--crit-soft); color: var(--crit); box-shadow: inset 0 0 0 2px var(--crit-line); }
.rd-c .nm { font-size: 20px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; line-height: 1.3; min-width: 0; }
.rd-c .stt { font-size: 18px; font-weight: 700; }
.rd-c.ok .stt { color: var(--good); }
.rd-c.part .stt { color: var(--warn); }
.rd-c.no .stt { color: var(--crit); }
.rd-c .why { font-size: 18px; color: var(--ink2); line-height: 1.3; min-width: 0; }
.rm { display: inline-flex; width: 1.05em; height: 1.05em; vertical-align: -0.16em; flex: none; }
.rm svg { width: 100%; height: 100%; }
.rm.ok { color: var(--good); }
.rm.part { color: var(--warn); }
.rm.no { color: var(--crit); }
.gchip { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700; border-radius: 6px; padding: 0 6px; line-height: 1.45; white-space: nowrap; }
.gchip svg { width: 14px; height: 14px; }
.gchip.no { color: var(--crit); background: var(--crit-soft); box-shadow: inset 0 0 0 1px var(--crit-line); }
.gchip.part { color: var(--warn); background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn-line); }

/* ①②③ 가로 흐름 */
.flow { flex: 1; display: grid; grid-template-columns: 0.98fr 24px 1.2fr 24px 1.08fr; min-height: 0; }
.arrow { display: flex; justify-content: center; padding-top: 26px; color: var(--muted); }
.arrow svg { width: 20px; height: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.card.human { border-color: var(--warn-line); }
.col3 { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.col3 .card.human { flex: 1; }
.c-head { padding: 9px 16px 8px; border-bottom: 1px solid var(--line2); }
.c-title { display: flex; align-items: center; gap: 10px; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.card.human .num { background: var(--warn); color: var(--card); }
.c-title h2 { margin: 0; font-size: 19px; line-height: 1.3; }
.c-title .stg { font-size: 14px; color: var(--muted); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700;
  border-radius: 999px; padding: 2px 11px; white-space: nowrap; }
.status.done { background: var(--good-soft); color: var(--good); }
.status.ready { background: var(--warn-soft); color: var(--warn); }
.status.wait { background: var(--line2); color: var(--muted); }
.status.busy { background: var(--accent-soft); color: var(--accent); }
.status.next { background: transparent; color: var(--muted); border: 1px dashed var(--axis); }
.status .t { font-weight: 400; }
.c-body { padding: 11px 16px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.c-body.spread { justify-content: space-between; }
.placeholder { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 16px;
  border: 1px dashed var(--line); border-radius: 10px; padding: 24px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent);
  animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 공통 블록 */
.sec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.sec-h h3 { margin: 0; font-size: 15px; line-height: 1.3; }
.sec-h h3 span { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.sec-h .src { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; line-height: 1.5; white-space: nowrap; }
.sec-h .src svg { width: 14px; height: 14px; }
.sec-h .src .rm { width: 15px; height: 15px; }
.idc { font-size: 14px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.muted { color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }

/* ① 조회 */
.req .r1 { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.req .r1 .mono { font-size: 15px; color: var(--ink); }
.req .ttl { font-size: 16px; font-weight: 700; margin-top: 2px; line-height: 1.4; }
.req .ask { font-size: 14px; color: var(--ink2); margin-top: 1px; }
.kv { display: grid; gap: 5px; font-size: 14px; }
.kv > div { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
.kv .t { font-size: 15px; font-weight: 700; color: var(--ink); }
.kv .s { color: var(--muted); }
.case { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: baseline; font-size: 14px; padding: 3px 0; }
.case + .case { border-top: 1px solid var(--line2); padding-top: 6px; }
.case .t { font-size: 15px; color: var(--ink); }
.case .s { grid-column: 2 / 4; color: var(--muted); }
.res { font-size: 14px; font-weight: 700; border-radius: 999px; padding: 0 9px; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.res svg { width: 14px; height: 14px; }
.res.ok { color: var(--good); background: var(--good-soft); }
.res.no { color: var(--crit); background: var(--crit-soft); }
.bst { display: grid; grid-template-columns: 1.05fr 0.9fr 1.25fr; gap: 8px; margin-bottom: 4px; }
.bst > div { background: var(--soft); border-radius: 8px; padding: 4px 10px 5px; }
.bst .l { font-size: 14px; color: var(--muted); line-height: 1.3; }
.bst .v { font-size: 22px; font-weight: 700; line-height: 1.2; }
.bst .v small { font-size: 14px; font-weight: 700; color: var(--ink2); margin-left: 2px; }
.bst .v .ar { font-size: 16px; color: var(--muted); margin: 0 4px; font-weight: 400; }
.chart-cap { font-size: 14px; color: var(--ink2); font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.chart-cap span { font-weight: 400; color: var(--muted); }
svg.viz { display: block; overflow: visible; }
svg.viz text { font-family: inherit; font-size: 14px; fill: var(--muted); }
svg.viz text.ink { fill: var(--ink2); }
svg.viz text.strong { fill: var(--ink); font-weight: 700; }
svg.viz .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
svg.viz .bl { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg.viz .mk { stroke: var(--ink2); stroke-width: 1; shape-rendering: crispEdges; }
svg.viz .c { fill: var(--bar); }
svg.viz .c.dim { fill: var(--bar-dim); }
svg.viz .hit { fill: transparent; cursor: default; }
svg.viz g.h:hover .c { filter: brightness(1.15); }
.srcline { margin-top: auto; border-top: 1px solid var(--line2); padding-top: 8px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.srcline span { display: inline-flex; align-items: center; gap: 4px; }
.srcline svg { color: var(--good); width: 14px; height: 14px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--card); font-size: 14px;
  border-radius: 6px; padding: 5px 10px; opacity: 0; transition: opacity .1s; z-index: 20; white-space: nowrap; }

/* ② 분석 */
.tgt { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; font-size: 14px; padding: 7px 12px; }
.tgt dt { color: var(--muted); }
.tgt dd { margin: 0; display: flex; gap: 8px; align-items: baseline; color: var(--ink2); white-space: nowrap; }
.tgt dd.v { font-size: 15px; font-weight: 700; color: var(--ink); }
.tgt dd .idc { font-size: 14px; }
.sn { width: 20px; height: 20px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--good-dot); color: #fff; line-height: 1; }
.vds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vd { border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px 8px; }
.vd-h { display: flex; align-items: center; gap: 7px; }
.vd-h .nm { font-size: 15px; font-weight: 700; }
.bdg { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.bdg svg { width: 15px; height: 15px; }
.bdg.good { color: var(--good); background: var(--good-soft); }
.bdg.warn { color: var(--warn); background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn-line); }
.bdg.info { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.vd-t { font-size: 14px; color: var(--ink2); margin-top: 2px; line-height: 1.4; }
.imp-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.imp-tiles > div { border: 1px solid var(--line); border-radius: 10px; padding: 5px 11px 6px; }
.imp-tiles > div.guessy { border: 1.5px dashed var(--crit); background: var(--crit-soft); }
.imp-tiles .l { font-size: 14px; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.imp-tiles .v { font-size: 26px; font-weight: 700; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.imp-tiles .v small { font-size: 15px; margin-left: 2px; color: var(--ink2); }
.imp-tiles .s { font-size: 14px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.conf { font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 1px 7px; align-items: baseline;
  border: 1.5px dashed var(--crit-line); border-radius: 10px; padding: 6px 11px; }
.conf .rm { width: 16px; height: 16px; align-self: center; }
.conf .c1 { color: var(--ink); font-weight: 700; font-size: 15px; }
.conf .c2 { grid-column: 2; color: var(--ink2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.chg { font-size: 14px; color: var(--ink2); display: flex; align-items: baseline; gap: 6px; white-space: nowrap; margin: -2px 0 6px; padding: 0 2px; }
.chg > b { color: var(--muted); font-weight: 700; margin-right: 4px; }
.chg span b { color: var(--ink); }
.chg i { font-style: normal; color: var(--axis); }
.vd-g { margin-top: 4px; font-size: 14px; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sum { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
.sum .h { font-size: 14px; color: var(--ink2); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.sum .h span { font-weight: 400; color: var(--muted); }
.sum p { margin: 2px 0 0; font-size: 15px; line-height: 1.5; }
.sum p.g { color: var(--ink2); font-size: 14px; }
.guess { display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--warn);
  background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 6px; padding: 0 6px; margin-left: 6px; line-height: 1.4; vertical-align: 1px; }
.model { margin-top: auto; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line2); padding-top: 8px; }

/* ③ 받기: 메일 보고서 초안 */
.mail { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.mail-bar { display: flex; align-items: center; gap: 8px; background: var(--soft); border-bottom: 1px solid var(--line); padding: 4px 12px; font-size: 14px; color: var(--ink2); }
.mail-bar svg { width: 16px; height: 16px; }
.mail-bar .pv { margin-left: auto; font-size: 14px; color: var(--muted); border: 1px dashed var(--axis); border-radius: 6px; padding: 0 8px; }
.mail-h { display: grid; grid-template-columns: 64px 1fr; gap: 3px 8px; padding: 7px 12px; border-bottom: 1px solid var(--line2); font-size: 14px; align-items: baseline; }
.mail-h dt { color: var(--muted); }
.mail-h dd { margin: 0; }
.mail-h .to { font-weight: 700; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.lock { font-weight: 400; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.lock svg { width: 14px; height: 14px; }
.mail-h .subj { font-weight: 700; font-size: 15px; line-height: 1.4; }
.nw { white-space: nowrap; }
.mail-b dt.hc { color: var(--warn); }
.mail-b dd.hcs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.mail-b { padding: 7px 12px 8px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 14px; line-height: 1.45; }
.mail-b dt { color: var(--muted); font-weight: 700; }
.mail-b dd { margin: 0; color: var(--ink); }
.mail-b ol, .mail-b ul { margin: 0; padding-left: 18px; }
.mail-b ol li { font-size: 15px; font-weight: 700; }
.mail-b ol li::marker { color: var(--muted); }
.mail-b ul li::marker { color: var(--muted); }
.gate { margin-top: auto; display: grid; gap: 6px; border-top: 1px solid var(--line2); padding-top: 8px; }
.check { display: flex; align-items: center; gap: 9px; font-size: 15px; cursor: pointer; user-select: none; }
.check input { width: 19px; height: 19px; accent-color: var(--accent); margin: 0; }
.send { width: 100%; display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 700; padding: 9px 16px; }
.send svg { width: 19px; height: 19px; }
.send[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; }
.hint { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.hint svg { width: 15px; height: 15px; margin-top: 2px; }

/* ④ 결정 적용 (다음 단계) */
.card.next { border-style: dashed; box-shadow: none; background: transparent; flex: none; }
.card.next .c-head { min-height: 0; border-bottom: 0; padding-bottom: 2px; }
.card.next .num { background: transparent; color: var(--muted); border: 2px dashed var(--axis); }
.card.next .c-title h2 { color: var(--ink2); }
.card.next .c-body { padding-top: 2px; gap: 6px; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.chain .k { color: var(--muted); }
.chain .it { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 2px 9px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.chain svg { width: 15px; height: 15px; color: var(--muted); }
.next-note { font-size: 14px; color: var(--ink2); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.next-note svg { width: 14px; height: 14px; }

/* 아래 줄 */
.foot { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.demo-badge { position: relative; z-index: 11; font-size: 15px; font-weight: 700; color: var(--crit); border: 2px dashed var(--crit);
  border-radius: 8px; padding: 1px 12px; background: var(--card); white-space: nowrap; }

/* 확인 창 */
.overlay { position: fixed; inset: 0; background: rgba(12,17,28,.66); display: none; align-items: center; justify-content: center; z-index: 10; }
.overlay.on { display: flex; }
.dlg { width: 660px; max-width: calc(100vw - 32px); background: var(--card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  overflow: hidden; border: 1px solid var(--line); }
.dlg-h { padding: 18px 24px 14px; border-bottom: 1px solid var(--line2); display: flex; align-items: center; gap: 12px; }
.dlg-h .q { width: 36px; height: 36px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; flex: none; }
.dlg-h .q svg { width: 21px; height: 21px; }
.dlg-h h2 { margin: 0; font-size: 22px; }
.dlg-b { padding: 16px 24px 6px; display: grid; gap: 14px; }
.dmeta { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; font-size: 16px; align-items: baseline; margin: 0; }
.dmeta dt { color: var(--muted); }
.dmeta dd { margin: 0; font-weight: 700; font-size: 17px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; line-height: 1.4; }
.one { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--good);
  background: var(--good-soft); border-radius: 999px; padding: 0 10px; }
.one svg { width: 14px; height: 14px; }
.dsum { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 10px 14px; font-size: 15px; line-height: 1.6; }
.dsum .h { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.dsum ol { margin: 0; padding-left: 20px; font-weight: 700; }
.dsum .more { font-size: 14px; color: var(--muted); margin-top: 4px; }
.dhc { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 15px; }
.dhc b { color: var(--warn); margin-right: 2px; }
.warnline { font-size: 15px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; align-items: flex-start; }
.warnline svg { margin-top: 2px; }
.dlg-f { padding: 14px 24px 20px; display: flex; justify-content: flex-end; gap: 10px; }
.btn2 { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; font-size: 18px; font-weight: 700; padding: 10px 26px; }
.btn1 { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; font-size: 18px; font-weight: 700; padding: 10px 30px; display: inline-flex; align-items: center; gap: 8px; }
.btn1 svg { width: 18px; height: 18px; }
.sent { text-align: center; padding: 22px 24px 6px; font-size: 17px; }
.sent .ok { width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; }
.sent .ok svg { width: 28px; height: 28px; }
.sent p { margin: 4px 0; }
.sent .small { font-size: 14px; color: var(--muted); }
</style>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var STATE = params.get('state'); // done | confirm
  var DATA = null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var icon = function (name, cls) { return '<svg class="' + (cls || 'i') + '"><use href="#i-' + name + '"/></svg>'; };
  var fmt = function (n) { return Number(n).toLocaleString('ko-KR'); };
  // 받는 사람: 나 · 가상 Knox ID · 가상 메일 주소 (고정)
  var toLine = function (r) { return [r.to, r.to_knox, r.to_mail].filter(Boolean).map(esc).join(' · '); };
  var subj = function (t) { return esc(t).replace(/\((REQ-[\d-]+)\)/, '<span class="nw">($1)</span>'); };
  // AI Ready 준비 상태: ok 준비됨(✓) · part 일부(△) · no 안 됨(✗). 띠, ① 출처 칩, ②③ 짐작 표시가 같은 기호를 씀
  var MARK = { ok: 'check', part: 'tri', no: 'x' };
  var RLBL = { ok: '준비됨', part: '일부', no: '안 됨' };
  var mk = function (st) { return '<span class="rm ' + st + '" title="AI Ready: ' + RLBL[st] + '">' + icon(MARK[st], '') + '</span>'; };
  var marks = function (t) { return esc(t).replace(/✓/g, mk('ok')).replace(/△/g, mk('part')).replace(/✗/g, mk('no')); };
  var gchip = function (st, t) { return '<span class="gchip ' + st + '">' + icon(MARK[st], '') + esc(t) + '</span>'; };
  var srcChip = function (list) { return '<span class="src">' + list.map(function (x) { return mk(x.ready) + esc(x.name); }).join(' · ') + '</span>'; };

  if (location.hostname) $('where').textContent = '내 PC에서만 열리는 화면 · ' + location.hostname;

  // 처음 화면에 보일 10단계 (실행 뒤에는 /api/run 값으로 다시 그림)
  var STAGES = [
    { no: 1, label: '요청 접수', group: 'run', uses: ['q'] }, { no: 2, label: '정책 특정', group: 'run', uses: ['a'] },
    { no: 3, label: '근거 확인', group: 'run', uses: ['q', 'a'] }, { no: 4, label: '유효성 확인', group: 'run', uses: ['a'] },
    { no: 5, label: '유사 사례', group: 'run', uses: ['q', 'a'] }, { no: 6, label: '개선 필요성', group: 'run', uses: ['q', 'a'] },
    { no: 7, label: '개선 가능 여부', group: 'run', uses: ['a'] }, { no: 8, label: '영향도 분석', group: 'run', uses: ['a'] },
    { no: 9, label: '의사결정 회부', group: 'receive', sub: '나에게 초안' }, { no: 10, label: '결정사항 적용', group: 'apply', sub: '다음 단계' }
  ];
  var stageState = {};

  // 처음 화면에 보일 AI Ready 상태 (실행 뒤에는 /api/run 값으로 다시 그림)
  var READY = {
    items: [
      { name: '개선 요청 접수함', state: 'ok', why: '요청이 항목별로 나뉨' },
      { name: '정책문서', state: 'ok', why: '조항 번호(§4.2)로 찾음' },
      { name: 'KM 결정 이력·유사 사례', state: 'part', why: '결정은 항목, 옛 사례는 본문에만' },
      { name: 'Splunk 차단 이력', state: 'ok', why: '부서·서버·날짜로 바로 셈' },
      { name: '정책 간 관계', state: 'no', why: '연결 정보 없음 → AI가 짐작' }
    ],
    note: ['이 화면이 되려면 데이터가 AI가 읽을 수 있게 준비돼 있어야 합니다.', '△·✗인 곳은 AI가 짐작하므로 사람이 확인합니다.']
  };
  function renderReadiness(items, note) {
    $('ready').innerHTML =
      '<div class="rd-h"><span class="ttl">' + icon('db', '') + '이 화면이 되려면 · 데이터 AI Ready 상태</span>' +
        '<span class="msg">' + marks(note[0]) + ' <b>' + marks(note[1]) + '</b></span></div>' +
      '<div class="rd-cells">' + items.map(function (r) {
        return '<div class="rd-c ' + r.state + '"><span class="sym" title="' + RLBL[r.state] + '">' + icon(MARK[r.state], '') + '</span>' +
          '<div class="nm">' + esc(r.name) + '<span class="stt">' + RLBL[r.state] + '</span></div><div class="why">' + marks(r.why) + '</div></div>';
      }).join('') + '</div>';
  }

  function renderStepper(stages) {
    var run = stages.filter(function (s) { return s.group === 'run'; });
    var recv = stages.filter(function (s) { return s.group === 'receive'; });
    var apply = stages.filter(function (s) { return s.group === 'apply'; });
    function cell(s, last) {
      var us = s.uses ? s.uses.map(function (u) { return '<span class="u ' + u + '" title="' + (u === 'q' ? '① 조회' : '② 사내 AI 분석') + '">' + (u === 'q' ? '1' : '2') + '</span>'; }).join('')
        : '<span class="tag" id="stsub' + s.no + '">' + esc(s.sub || '') + '</span>';
      return '<div class="st wait" id="st' + s.no + '"><span class="dot">' + s.no + '</span><div class="tx"><div class="lb">' + esc(s.label) + '</div><div class="us">' + us + '</div></div>' +
        (last ? '' : '<span class="ln"></span>') + '</div>';
    }
    $('stepper').innerHTML =
      '<div class="sg g-run"><div class="sg-h"><span class="u q">1</span><b>조회</b><span>+</span><span class="u a">2</span><b>사내 AI 분석</b><span>· [실행] 한 번에 1~8단계</span><span class="gst" id="gst1"></span></div>' +
        '<div class="sg-steps">' + run.map(function (s, i) { return cell(s, i === run.length - 1); }).join('') + '</div></div>' +
      '<div class="sg g-recv"><div class="sg-h"><span class="u r">3</span><b>받기</b><span>· 나에게</span></div><div class="sg-steps">' + recv.map(function (s) { return cell(s, true); }).join('') + '</div></div>' +
      '<div class="sg g-apply"><div class="sg-h"><span class="u n">4</span><b>결정 적용</b></div><div class="sg-steps">' + apply.map(function (s) { return cell(s, true); }).join('') + '</div></div>';
    Object.keys(stageState).forEach(function (no) { setStage(+no, stageState[no]); });
  }
  function setStage(no, kind) { stageState[no] = kind; var el = $('st' + no); if (el) el.className = 'st ' + kind; }
  function setGroup(html, kind) { var el = $('gst1'); el.className = 'gst ' + (kind || ''); el.innerHTML = html; }

  function setStatus(n, kind, html) { var el = $('s' + n); el.className = 'status ' + kind; el.innerHTML = html; }
  function busy(n, pill, text) { setStatus(n, 'busy', esc(pill)); $('b' + n).innerHTML = '<div class="placeholder"><div><div class="spin"></div>' + esc(text) + '</div></div>'; }

  function renderFlow(d) {
    renderReadiness(d.readiness, d.readiness_note);
    $('flowName').textContent = d.flow_file;
    $('flowRead').hidden = false;
    $('targetV').innerHTML = '<span class="mono">' + esc(d.target.id) + '</span> · ' + esc(d.target.team) + ' <span class="new">' + esc(d.target.note) + '</span>';
  }

  // 일별 차단 막대 (한 계열: 범례 없이 제목이 이름)
  function dailyChart(b, W, H) {
    var mt = 22, mb = 22, ml = 32, mr = 2, ph = H - mt - mb, pw = W - ml - mr;
    var ymax = 125, n = b.daily.length, slot = pw / n, bw = Math.min(24, slot - 2);
    var y = function (v) { return mt + ph - v / ymax * ph; };
    var s = '<svg class="viz" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc('일별 차단 건수: ' + b.daily.join(', ')) + '">';
    [0, 50, 100].forEach(function (t) {
      s += '<line class="' + (t === 0 ? 'bl' : 'gl') + '" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Math.round(y(t)) + '.5" y2="' + Math.round(y(t)) + '.5"/>';
      s += '<text x="' + (ml - 6) + '" y="' + (y(t) + 5) + '" text-anchor="end">' + t + '</text>';
    });
    var start = b.daily_from.split('/'), d0 = new Date(2026, +start[0] - 1, +start[1]);
    var lab = function (i) { var dd = new Date(d0.getTime() + i * 864e5); return (dd.getMonth() + 1) + '/' + dd.getDate(); };
    for (var i = 0; i < n; i++) {
      var v = b.daily[i], x = ml + i * slot + (slot - bw) / 2, top = y(v), h = mt + ph - top, r = Math.min(4, bw / 2, h);
      var path = 'M' + x + ',' + (mt + ph) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + (mt + ph) + 'Z';
      s += '<g class="h" data-tip="' + esc(lab(i) + ' · 차단 ' + v + '건') + '"><rect class="hit" x="' + (ml + i * slot) + '" y="' + mt + '" width="' + slot + '" height="' + ph + '"/><path class="c" d="' + path + '"/></g>';
    }
    var mx = Math.round(ml + b.mark_index * slot) - 0.5;
    s += '<line class="mk" x1="' + mx + '" x2="' + mx + '" y1="4" y2="' + (mt + ph) + '"/>';
    s += '<text class="ink" x="' + (mx + 6) + '" y="15">' + esc(b.mark_label) + '</text>';
    [0, b.mark_index, n - 1].forEach(function (i, k) {
      var cx = ml + i * slot + slot / 2;
      s += '<text x="' + (k === 0 ? ml : (k === 2 ? W - mr : cx)) + '" y="' + (H - 4) + '" text-anchor="' + (k === 0 ? 'start' : (k === 2 ? 'end' : 'middle')) + '">' + lab(i) + '</text>';
    });
    return s + '</svg>';
  }

  function renderQuery(d) {
    var q = d.query, st = d.steps[0], rq = q.request, p = q.policy, b = q.blocks;
    setStatus(1, 'done', icon('check') + '완료 <span class="t">· ' + st.seconds + '초</span>');
    var pre = b.daily.slice(0, b.mark_index), post = b.daily.slice(b.mark_index);
    var avg = function (a) { return Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length); };
    var mine = b.by_team.filter(function (t) { return t.mine; })[0];
    var cases = q.cases.map(function (c) {
      var ok = c.result === '승인';
      return '<div class="case"><span class="idc mono">' + esc(c.id) + '</span><span class="t">' + esc(c.text) + '</span>' +
        '<span class="res ' + (ok ? 'ok' : 'no') + '">' + icon(ok ? 'check' : 'x') + esc(c.result) + '</span>' +
        '<span class="s">' + esc(c.cond) + ' · ' + esc(c.when) + '</span></div>';
    }).join('');
    $('b1').innerHTML =
      '<div class="sec"><div class="sec-h"><h3>접수된 요청</h3>' + srcChip(rq.source) + '</div>' +
        '<div class="box req"><div class="r1"><span class="mono">' + esc(rq.id) + '</span><span>' + esc(rq.team) + ' · ' + esc(rq.received) + '</span></div>' +
        '<div class="ttl">' + esc(rq.title) + '</div><div class="ask">요청: ' + esc(rq.ask) + '</div></div></div>' +
      '<div class="sec"><div class="sec-h"><h3>매칭 정책 · 근거</h3>' + srcChip(p.source) + '</div>' +
        '<div class="kv"><div><span class="idc mono">' + esc(p.id) + ' ' + esc(p.clause) + '</span><span class="t">' + esc(p.name) + '</span></div>' +
        '<div><span class="idc mono">' + esc(p.basis_id) + '</span><span class="s">결정 이력</span><span>' + esc(p.basis) + '</span></div></div></div>' +
      '<div class="sec"><div class="sec-h"><h3>유사 사례 <span>' + q.cases.length + '건</span></h3>' + srcChip(q.cases_source) + '</div>' + cases + '</div>' +
      '<div class="sec" id="blkSec"><div class="sec-h"><h3>차단 이력 <span>최근 30일</span></h3>' + srcChip(b.source) + '</div>' +
        '<div class="bst"><div><div class="l">차단</div><div class="v">' + fmt(b.total) + '<small>건</small></div></div>' +
        '<div><div class="l">' + esc(mine.team) + ' 비중</div><div class="v">' + Math.round(mine.count / b.total * 100) + '<small>%</small></div></div>' +
        '<div><div class="l">하루 평균 전→후</div><div class="v">' + avg(pre) + '<span class="ar">→</span>' + avg(post) + '<small>건</small></div></div></div>' +
        '<div class="chart-cap">일별 차단 <span>건 · 저장소 ' + b.domains + '곳 · 빌드 서버 ' + b.servers + '대</span></div><div id="daily"></div></div>';
    // 남는 세로 공간만큼 막대를 키움 (112~180px), 남은 틈은 블록 사이에 고르게
    var host = $('daily'), W = Math.floor(host.getBoundingClientRect().width), body = $('b1');
    body.classList.remove('spread');
    host.innerHTML = dailyChart(b, W, 112);
    var free = body.getBoundingClientRect().bottom - parseFloat(getComputedStyle(body).paddingBottom) - $('blkSec').getBoundingClientRect().bottom;
    if (free > 4) host.innerHTML = dailyChart(b, W, Math.min(180, 112 + Math.floor(free) - 2));
    body.classList.add('spread');
    bindTips($('b1'));
  }

  function renderAnalysis(d) {
    var a = d.analysis, st = d.steps[1], t = a.target, im = a.impact;
    setStatus(2, 'done', icon('check') + '완료 <span class="t">· ' + st.seconds + '초</span>');
    var vd = a.verdicts.map(function (v) {
      var ic = v.kind === 'good' ? 'check' : (v.kind === 'warn' ? 'alert' : 'half');
      return '<div class="vd"><div class="vd-h"><span class="sn" title="' + v.step + '단계">' + v.step + '</span><span class="nm">' + esc(v.label) + '</span><span class="bdg ' + v.kind + '">' + icon(ic) + esc(v.badge) + '</span></div>' +
        '<div class="vd-t">' + esc(v.text) + '</div>' +
        (v.check ? '<div class="vd-g">' + gchip(v.check.ready, '사람 확인') + '<span>' + esc(v.check.text) + '</span></div>' : '') + '</div>';
    }).join('');
    var tiles = im.tiles.map(function (x) {
      return '<div' + (x.guess ? ' class="guessy"' : '') + '><div class="l">' + esc(x.label) + (x.guess ? gchip(x.guess, '짐작') : '') + '</div>' +
        '<div class="v"><span>' + esc(x.value) + '<small>' + esc(x.unit) + '</small></span>' + (x.sub ? '<span class="s">' + esc(x.sub) + '</span>' : '') + '</div></div>';
    }).join('');
    $('b2').innerHTML =
      '<div class="sec"><div class="sec-h"><span class="sn" title="2단계">2</span><h3>개선할 정책 특정</h3><span class="src">요구사항 분석 · 정책 매칭</span></div>' +
        '<dl class="tgt box"><dt>요구사항</dt><dd class="v">' + esc(t.need) + '</dd>' +
        '<dt>매칭 정책</dt><dd><span class="idc mono">' + esc(t.match) + '</span><span>' + esc(t.match_note) + '</span></dd>' +
        '<dt>함께 걸림</dt><dd><span class="idc mono">' + esc(t.related) + '</span><span>' + esc(t.related_note) + '</span>' + (t.related_guess ? gchip(t.related_guess, '짐작') : '') + '</dd></dl></div>' +
      '<div class="vds">' + vd + '</div>' +
      '<div class="sec"><div class="sec-h"><span class="sn" title="8단계">8</span><h3>영향도 분석</h3><span class="src">정책 간 충돌 · 바꿀 규모</span></div>' +
        '<div class="imp-tiles">' + tiles + '</div>' +
        '<div class="chg"><b>바꿀 곳</b>' + im.rows.map(function (r) { return '<span title="' + esc(r.what) + '">' + esc(r.where) + ' <b>' + esc(r.n) + '</b></span>'; }).join('<i>·</i>') + '</div>' +
        '<div class="conf">' + mk('no') + '<span class="c1">' + esc(im.conflict) + '</span><span class="c2">' + gchip('no', im.conflict_guess) + '<span>' + esc(im.conflict_why) + '</span></span></div></div>' +
      '<div class="sum"><div class="h">' + icon('chip') + '요약<span>· 사내 AI 모델 · 숫자와 문서 번호는 ① 조회 결과에서</span></div>' +
        a.summary.map(function (x) { return '<p' + (x.guess ? ' class="g"' : '') + '>' + marks(x.text) + '</p>'; }).join('') + '</div>';
    $('b2').classList.add('spread');
  }

  function renderDraft(d, checked) {
    var r = d.draft;
    setStatus(3, 'ready', icon('alert') + '초안 준비 <span class="t">· 확인 대기</span>');
    $('b3').innerHTML =
      '<div class="mail"><div class="mail-bar">' + icon('mail') + '<span>' + esc(r.channel) + ' · 나에게 보낼 보고서</span><span class="pv">미리보기</span></div>' +
        '<dl class="mail-h"><dt>받는 사람</dt><dd class="to"><span>' + toLine(r) + '</span><span class="lock">' + icon('lock') + '고정</span></dd>' +
        '<dt>제목</dt><dd class="subj">' + subj(r.subject) + '</dd></dl>' +
        '<dl class="mail-b"><dt>요약</dt><dd><ol>' + r.summary.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ol></dd>' +
        '<dt>근거</dt><dd><ul>' + r.basis.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></dd>' +
        '<dt>권고안</dt><dd>' + esc(r.recommend) + '</dd>' +
        '<dt>결정 요청</dt><dd>' + esc(r.decide) + '</dd>' +
        '<dt class="hc">사람 확인</dt><dd class="hcs">' + r.checks.map(function (c) { return gchip(c.ready, c.text); }).join('') + '</dd></dl></div>' +
      '<div class="gate"><label class="check"><input type="checkbox" id="seen"' + (checked ? ' checked' : '') + '>' + esc(r.seen_label) + '</label>' +
        '<button class="send" id="sendBtn" type="button"' + (checked ? '' : ' disabled') + '>' + icon('send', '') + '나에게 보내기</button>' +
        '<div class="hint">' + icon('info') + '<span>체크 뒤에만 보낼 수 있습니다 · ' + esc(r.forward) + '</span></div></div>';
    $('seen').addEventListener('change', function () { $('sendBtn').disabled = !this.checked; });
    $('sendBtn').addEventListener('click', openConfirm);
  }

  function renderApply(d) {
    var ap = d.apply;
    $('b4').innerHTML =
      '<div class="chain"><span class="it">' + esc(ap.items[0]) + '</span>' + icon('arrow') +
        '<span class="it">' + esc(ap.items[1]) + '</span><span class="k">+</span><span class="it">' + esc(ap.items[2]) + '</span></div>' +
      '<div class="next-note">' + icon('lock') + esc(ap.note) + '</div>';
  }

  function finish(d) {
    $('last').innerHTML = '마지막 실행 <b>' + esc(d.ran_at) + '</b>';
    $('runBtn').disabled = false;
  }

  function stagesDone(d) {
    renderStepper(d.stages);
    d.stages.forEach(function (s) { setStage(s.no, s.group === 'run' ? 'done' : (s.group === 'receive' ? 'ready' : 'next')); });
    setGroup(icon('check') + '8단계 완료 · ' + Math.round(d.steps[0].seconds + d.steps[1].seconds) + '초', 'done');
    var sub = $('stsub9'); if (sub) sub.textContent = '초안 · 확인 대기';
  }

  function openConfirm() {
    var r = DATA.draft;
    $('dlg').innerHTML =
      '<div class="dlg-h"><span class="q">' + icon('send', '') + '</span><h2 id="dlgTitle">보고서 초안을 나에게 보낼까요?</h2></div>' +
      '<div class="dlg-b"><dl class="dmeta"><dt>받는 사람</dt><dd><span>' + toLine(r) + '</span><span class="one">' + icon('check') + '1명</span><span class="lock">' + icon('lock') + '고정 · 바꿀 수 없음</span></dd>' +
      '<dt>보내는 곳</dt><dd>' + esc(r.channel) + '</dd><dt>제목</dt><dd><span>' + subj(r.subject) + '</span></dd></dl>' +
      '<div class="dsum"><div class="h">보고서 요약 (방금 본 미리보기와 같음)</div><ol>' + r.summary.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ol>' +
      '<div class="dhc"><b>사람 확인 ' + r.checks.length + '곳</b>' + r.checks.map(function (c) { return gchip(c.ready, c.text); }).join('') + '</div>' +
      '<div class="more">근거 ' + r.basis.length + '줄 · 권고안 · 결정 요청 · 사람 확인 ' + r.checks.length + '곳이 함께 갑니다.</div></div>' +
      '<div class="warnline">' + icon('alert') + '<span>결재권자에게는 내가 검토한 뒤 직접 전달합니다. 지금은 나에게만 갑니다.</span></div></div>' +
      '<div class="dlg-f"><button class="btn2" id="cancelBtn" type="button">취소</button><button class="btn1" id="okBtn" type="button">' + icon('send', '') + '보내기</button></div>';
    $('overlay').classList.add('on');
    $('cancelBtn').addEventListener('click', closeConfirm);
    $('okBtn').addEventListener('click', doSend);
  }
  function closeConfirm() { $('overlay').classList.remove('on'); }

  function doSend() {
    $('okBtn').disabled = true;
    fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subject: DATA.draft.subject }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var to = '<p class="small">받는 사람 · ' + toLine(DATA.draft) + '</p>';
        var msg = res.demo ? '<p><b>보내기 완료 (예시)</b></p>' + to + '<p class="small">' + esc(res.message || '') + '</p>'
          : '<p><b>보냈습니다.</b> 사내 메일에서 확인하세요.</p>' + to;
        $('dlg').innerHTML = '<div class="sent"><div class="ok">' + icon('check', '') + '</div>' + msg + '</div><div class="dlg-f"><button class="btn1" id="closeBtn" type="button">닫기</button></div>';
        $('closeBtn').addEventListener('click', closeConfirm);
        setStatus(3, 'done', icon('check') + '나에게 보냄');
        setStage(9, 'done'); var sub = $('stsub9'); if (sub) sub.textContent = '나에게 보냄';
        $('seen').disabled = true; $('sendBtn').disabled = true; $('sendBtn').innerHTML = icon('check', '') + '나에게 보냄 · 결재권자 전달은 메일에서';
      })
      .catch(function () { $('okBtn').disabled = false; });
  }

  var tip = $('tip');
  function bindTips(root) {
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) { tip.textContent = el.getAttribute('data-tip'); tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; tip.style.opacity = 1; });
      el.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
    });
  }

  function load() { return fetch('/api/run', { method: 'POST' }).then(function (r) { return r.json(); }); }

  function runAnimated() {
    $('runBtn').disabled = true;
    stageState = {}; renderStepper(DATA ? DATA.stages : STAGES);
    [2, 3].forEach(function (n) { setStatus(n, 'wait', '대기'); });
    $('b1').classList.remove('spread'); $('b2').classList.remove('spread');
    busy(1, '조회 중', '흐름 파일을 읽고 4곳을 조회하는 중…');
    $('b2').innerHTML = '<div class="placeholder">조회가 끝나면 사내 AI가 흐름 ②대로 분석합니다.</div>';
    $('b3').innerHTML = '<div class="placeholder">보고서 초안을 먼저 보여 드립니다.<br>보내기는 내가 확인한 뒤에만 합니다.</div>';
    STAGES.forEach(function (s) { if (s.uses && s.uses.indexOf('q') >= 0) setStage(s.no, 'busy'); });
    setGroup('조회 중', 'busy');
    load().then(function (d) {
      DATA = d; renderFlow(d); renderApply(d);
      setTimeout(function () {
        renderQuery(d); setStage(1, 'done'); busy(2, '분석 중', '사내 AI 모델이 2~8단계를 판단하는 중…');
        setGroup('분석 중', 'busy');
        var order = [2, 3, 4, 5, 6, 7, 8], k = 0;
        setStage(order[0], 'busy');
        var timer = setInterval(function () {
          setStage(order[k], 'done'); k++;
          if (k < order.length) { setStage(order[k], 'busy'); return; }
          clearInterval(timer);
          renderAnalysis(d); renderDraft(d, false); stagesDone(d); finish(d);
        }, 230);
      }, 900);
    }).catch(function () { setStatus(1, 'wait', '오류'); $('runBtn').disabled = false; });
  }

  $('runBtn').addEventListener('click', runAnimated);
  renderStepper(STAGES);
  renderReadiness(READY.items, READY.note);
  renderApply({ apply: { items: ['결정 메일 분석', 'KM 히스토리 초안', '요청자 회신 초안'], note: 'KM 적재와 회신은 내가 확인한 뒤에' } });

  if (STATE === 'done' || STATE === 'confirm') {
    load().then(function (d) {
      DATA = d; renderFlow(d); renderQuery(d); renderAnalysis(d); renderDraft(d, true); renderApply(d); stagesDone(d); finish(d);
      if (STATE === 'confirm') openConfirm();
      document.body.setAttribute('data-ready', '1');
    });
  } else {
    document.body.setAttribute('data-ready', '1');
  }
})();
</script>
</body>
</html>
